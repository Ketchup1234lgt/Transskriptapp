name: Transkription APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Transkription/package-lock.json

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: NDK und CMake installieren
        run: |
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Pakete installieren
        run: |
          cd Transkription
          npm ci --legacy-peer-deps

      - name: APK bauen
        run: |
          cd Transkription/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Transkription-APK
          path: Transkription/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
